# render.yaml — Thrift Vault API on Render (Docker)
#
# Render builds the Dockerfile in this directory; nothing here duplicates it.
# Create the service with:  Render Dashboard > New > Blueprint > pick this repo.
#
# The database is deliberately NOT defined here. Render's free Postgres is
# deleted after 30 days, which would silently take real orders with it. The DB
# lives on Neon instead (free, no expiry) and is passed in as DATABASE_URL.

services:
  - type: web
    name: thrift-vault-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    # Co-located with the Neon database in us-east-1. Do NOT move this closer to
    # the users: checkout holds a transaction open across many sequential queries,
    # so server-to-database latency is multiplied by the query count, while
    # user-to-server latency is paid once. Running this in Singapore against a
    # us-east-1 database made every checkout exceed the transaction timeout.
    region: virginia
    healthCheckPath: /health # real endpoint in src/app.js -> { status, uptime }

    # No dockerCommand override on purpose. Render runs the container command in
    # exec form, without a shell, so `migrate && node` would pass `&&` to prisma
    # as an argument and the container would exit as soon as migrations finished.
    # The Dockerfile's CMD runs docker-entrypoint.sh, which does both properly.
    #
    # (Migrations run at start-up rather than via preDeployCommand because the
    # free plan does not offer one. `migrate deploy` is idempotent.)

    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 4000
      - key: UPLOAD_DIR
        value: /app/uploads

      # --- set in the Render dashboard, never committed ---------------------
      # Neon pooled connection.
      - key: DATABASE_URL
        sync: false
      # Neon direct (non-pooled) connection. schema.prisma declares this as
      # directUrl; `migrate deploy` above fails without it.
      - key: DATABASE_URL_UNPOOLED
        sync: false
      - key: JWT_ACCESS_SECRET
        sync: false
      - key: JWT_REFRESH_SECRET
        sync: false
      # Comma-separated. Must list the storefront origin or the browser blocks
      # every API call while the site still loads perfectly.
      - key: CORS_ORIGINS
        sync: false
      # Without this, image uploads silently fall back to the container's
      # ephemeral disk and are wiped on every deploy.
      - key: BLOB_READ_WRITE_TOKEN
        sync: false
      - key: PAYMENT_WEBHOOK_SECRET
        sync: false
